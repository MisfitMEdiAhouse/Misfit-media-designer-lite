<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TITTIES embroidered patch</title>
  <desc id="desc">White rectangular embroidered patch with a black stitched border and bold black lowercase text reading titties.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="10" height="10" fill="#fafafa"/>
      <path d="M0 0V10" stroke="#e9e9e9" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#f2f2f0"/>
  <g filter="url(#shadow)">
    <rect x="80" y="150" width="1040" height="420" rx="78" fill="url(#weave)" stroke="#080808" stroke-width="34"/>
    <rect x="103" y="173" width="994" height="374" rx="58" fill="none" stroke="#111" stroke-width="5" stroke-dasharray="4 8" opacity=".55"/>
  </g>
  <text x="600" y="420" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="235" font-weight="900" letter-spacing="-12" fill="#090909">titties</text>
</svg>
