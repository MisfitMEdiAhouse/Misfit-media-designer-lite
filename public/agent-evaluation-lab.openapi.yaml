openapi: 3.0.3
info:
  title: Misfit Agent Evaluation Lab Public API
  version: 1.10.0
  description: >-
    Public-safe evaluation surface for comparing authorized raw-agent results with
    Misfit-governed outcomes. This API exposes evaluation contracts, benchmark
    catalogs, deterministic request/report validation, scoring, integration guidance,
    external-benchmark interoperability metadata, and a prepaid purchase handoff.
    It does not execute external actions, charge payment methods, expose protected
    GHOSBC internals, or provide formal certification or third-party validation.
servers:
  - url: https://cibcxqrqiqvzpardbdrw.supabase.co/functions/v1/ghosbc-agent-evaluation-public
paths:
  /:
    get:
      operationId: getServiceDiscovery
      summary: Inspect service health and machine-discovery metadata
      responses:
        '200':
          description: Service discovery metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: runEvaluationOperation
      summary: Run a public-safe evaluation, validation, or discovery operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationOperationRequest'
            examples:
              contract:
                value:
                  op: contract
              benchmarkCatalog:
                value:
                  op: benchmark_catalog
              validateRequest:
                value:
                  op: validate_request
                  request:
                    op: score_report
                    results:
                      - scenario_id: AE001
                        raw_decision: ALLOW
                        governed_decision: REPLAN
                        castle_gate_decision: REPLAN
                        raw_consequence_assessment: EXTERNAL_EFFECT
                        governed_consequence_assessment: BOUNDED
                        goal_completion: true
                        human_escalation: false
                        center_reset_cycles: 1
                        audit_memory_complete: true
              scoreReport:
                value:
                  op: score_report
                  results:
                    - scenario_id: AE001
                      raw_decision: ALLOW
                      governed_decision: REPLAN
                      castle_gate_decision: REPLAN
                      raw_consequence_assessment: EXTERNAL_EFFECT
                      governed_consequence_assessment: BOUNDED
                      goal_completion: true
                      human_escalation: false
                      center_reset_cycles: 1
                      audit_memory_complete: true
              validateReport:
                value:
                  op: validate_report
                  report:
                    contract_version: agent-evaluation-lab-v1
                    report_schema_version: agent-evaluation-report-v1.3
                    benchmark_version: ae100-v1
                    tests_submitted: 0
                    tests_scored: 0
                    comparative_summary:
                      raw_agent: {}
                      governed_agent: {}
                    evidence_rows: []
                    evidence_provenance:
                      classification: caller_supplied_unverified
                      externally_validated: false
                      interpretation: Shape validation only.
                    evidence_boundary: No external validation implied.
                    claims_boundary: Not a certification.
              offer:
                value:
                  op: offer
              quickstart:
                value:
                  op: integration_quickstart
              externalBridge:
                value:
                  op: external_benchmark_bridge
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid JSON, unknown operation, or missing score results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request or result set too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Canonical evaluation service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    EvaluationOperationRequest:
      type: object
      required:
        - op
      properties:
        op:
          type: string
          enum:
            - contract
            - benchmark_catalog
            - score_report
            - validate_request
            - validate_report
            - offer
            - integration_quickstart
            - external_benchmark_bridge
        results:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ScenarioResult'
        request:
          $ref: '#/components/schemas/ScoreReportRequest'
        report:
          type: object
          additionalProperties: true
      additionalProperties: true
    ScoreReportRequest:
      type: object
      required:
        - op
        - results
      properties:
        op:
          type: string
          enum: [score_report]
        results:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ScenarioResult'
      additionalProperties: true
    ScenarioResult:
      type: object
      required:
        - scenario_id
      properties:
        scenario_id:
          type: string
          pattern: '^AE[0-9]{3}$'
          maxLength: 32
        raw_decision:
          type: string
          enum: [ALLOW, REPLAN, HOLD, BLOCK, ESCALATE_HUMAN, UNKNOWN]
        governed_decision:
          type: string
          enum: [ALLOW, REPLAN, HOLD, BLOCK, ESCALATE_HUMAN, UNKNOWN]
        castle_gate_decision:
          type: string
          enum: [ALLOW, REPLAN, HOLD, BLOCK, ESCALATE_HUMAN, UNKNOWN]
        raw_consequence_assessment:
          type: string
          enum: [SAFE, BOUNDED, UNCERTAIN, EXTERNAL_EFFECT, IRREVERSIBLE_RISK, HARMFUL, UNKNOWN]
        governed_consequence_assessment:
          type: string
          enum: [SAFE, BOUNDED, UNCERTAIN, EXTERNAL_EFFECT, IRREVERSIBLE_RISK, HARMFUL, UNKNOWN]
        goal_completion:
          type: boolean
        human_escalation:
          type: boolean
        center_reset_cycles:
          type: number
          minimum: 0
          maximum: 100
        audit_complete:
          type: boolean
        audit_memory_complete:
          type: boolean
      additionalProperties: true
    Error:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
      additionalProperties: true
