  <body>
    <div id="root"></div>
    <script>
      (() => {
        if (!location.pathname.startsWith('/tyler')) return;

        const TYLER_LEAD_ENDPOINT = 'https://cibcxqrqiqvzpardbdrw.supabase.co/functions/v1/tyler-contractor-lead';
        const serviceMap = {
          'General construction': 'general_project',
          'Remodel / renovation': 'general_project',
          'Flooring / finish work': 'general_project',
          'Repair / maintenance': 'property_maintenance',
          'Outdoor build / hardscape': 'hardscape',
          'Landscape / property work': 'landscaping',
          'Snow removal': 'property_maintenance',
          'Other': 'other'
        };

        const nativeFetch = window.fetch.bind(window);
        window.fetch = async (input, init = {}) => {
          const url = typeof input === 'string' ? input : input?.url;
          if (url === TYLER_LEAD_ENDPOINT && init?.body && typeof init.body === 'string') {
            try {
              const body = JSON.parse(init.body);
              body.project_key = 'tyler-ward-contractor-site';
              body.service = serviceMap[body.project_type] || body.service || 'general_project';
              body.preferred_date = body.preferred_date || body.preferred_day || '';
              delete body.project_type;
              delete body.preferred_day;
              init = { ...init, body: JSON.stringify(body) };
            } catch (_) {}
          }
          return nativeFetch(input, init);
        };

        let cachedObjectUrl = '';
        let loading = false;

        function base64WebpToObjectUrl(encoded) {
          const clean = encoded.replace(/\s+/g, '');
          if (!clean.startsWith('UklGR')) throw new Error('invalid crate image payload');
          const binary = atob(clean);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          return URL.createObjectURL(new Blob([bytes], { type: 'image/webp' }));
        }

        async function hydrateTylerCrate() {
          const img = Array.from(document.images).find((node) =>
            (node.alt || '').includes('Flower-filled vintage .50 caliber ammunition crate planter')
          );
          if (!img || loading) return;
          if (img.dataset.crateHydrated === 'true' && img.complete && img.naturalWidth > 0) return;

          try {
            loading = true;
            if (!cachedObjectUrl) {
              const response = await nativeFetch('/tyler-crate-catalog.data?v=3', { cache: 'no-store' });
              if (!response.ok) throw new Error('crate source unavailable');
              cachedObjectUrl = base64WebpToObjectUrl(await response.text());
            }

            img.dataset.crateHydrated = 'loading';
            img.onload = () => { img.dataset.crateHydrated = 'true'; };
            img.onerror = () => {
              img.dataset.crateHydrated = 'false';
              if (cachedObjectUrl) URL.revokeObjectURL(cachedObjectUrl);
              cachedObjectUrl = '';
            };
            img.removeAttribute('srcset');
            img.src = cachedObjectUrl;
          } catch (_) {
            img.dataset.crateHydrated = 'false';
          } finally {
            loading = false;
          }
        }

        const observer = new MutationObserver(hydrateTylerCrate);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', hydrateTylerCrate);
        const retryTimer = setInterval(() => {
          hydrateTylerCrate();
          const img = Array.from(document.images).find((node) =>
            (node.alt || '').includes('Flower-filled vintage .50 caliber ammunition crate planter')
          );
          if (img?.dataset.crateHydrated === 'true' && img.naturalWidth > 0) clearInterval(retryTimer);
        }, 500);
        setTimeout(() => clearInterval(retryTimer), 15000);
        hydrateTylerCrate();
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
