name: Deploy CoffeeAndAJoint Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/caj-pages-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coffeeandajoint-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical storefront branch
        uses: actions/checkout@v5
        with:
          ref: coffee-pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload storefront artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4
