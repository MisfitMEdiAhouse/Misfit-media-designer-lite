name: CoffeeAndAJoint Credential Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/caj-credential-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      S_GH_PAT: ${{ secrets.GH_PAT }}
      S_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      S_GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
      S_MISFIT_GITHUB_PAT: ${{ secrets.MISFIT_GITHUB_PAT }}
      S_GITHUB_ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
      S_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Record only secret presence booleans
        run: |
          yn(){ if [ -n "$2" ]; then printf '%s=true\n' "$1"; else printf '%s=false\n' "$1"; fi; }
          {
            yn GH_PAT "$S_GH_PAT"
            yn GITHUB_PAT "$S_GITHUB_PAT"
            yn GITHUB_PERSONAL_ACCESS_TOKEN "$S_GITHUB_PERSONAL_ACCESS_TOKEN"
            yn MISFIT_GITHUB_PAT "$S_MISFIT_GITHUB_PAT"
            yn GITHUB_ADMIN_TOKEN "$S_GITHUB_ADMIN_TOKEN"
            yn PERSONAL_ACCESS_TOKEN "$S_PERSONAL_ACCESS_TOKEN"
            yn GH_TOKEN "$S_GH_TOKEN"
          } > caj-github-secret-presence.txt
          git config user.name 'Misfit Credential Probe'
          git config user.email 'pricemedia82@gmail.com'
          git add caj-github-secret-presence.txt
          git commit -m 'Record GitHub secret presence only' || exit 0
          git push
