name: CoffeeAndAJoint Replacement Host Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/caj-vtest-run.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create temporary vtest DNS record through existing GoDaddy bridge
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://misfit-media-designer-lite.vercel.app/api/admin/caj-vtest-4db219' > caj-vtest-result.json
      - name: Diagnose DNS and Vercel host routing using Vercel DNS target
        run: |
          set +e
          sleep 20
          { dig +short vtest.coffeeandajoint.co CNAME; dig +short vtest.coffeeandajoint.co A; } > caj-vtest-dns.txt 2>&1
          curl -k -sS -L -D caj-vtest-headers.txt -o caj-vtest-body.html -w '%{http_code}\n%{url_effective}\n' 'https://vtest.coffeeandajoint.co/' > caj-vtest-http.txt 2>caj-vtest-curl-error.txt
          head -c 1200 caj-vtest-body.html > caj-vtest-body-head.txt || true
          cat caj-vtest-dns.txt
          cat caj-vtest-http.txt
          cat caj-vtest-curl-error.txt
          cat caj-vtest-body-head.txt
      - name: Record result
        run: |
          git config user.name 'Misfit CAJ Test Bot'
          git config user.email 'pricemedia82@gmail.com'
          git add caj-vtest-result.json caj-vtest-dns.txt caj-vtest-http.txt caj-vtest-headers.txt caj-vtest-curl-error.txt caj-vtest-body-head.txt
          git commit -m 'Record CoffeeAndAJoint Vercel DNS host test' || exit 0
          git push
