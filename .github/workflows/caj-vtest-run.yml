name: CoffeeAndAJoint DNS Cutover Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/caj-vtest-run.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure reversible redirect test hostname
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://misfit-media-designer-lite.vercel.app/api/admin/caj-vtest-4db219?action=test-redirect&confirm=caj-495-cutover-20260820' > caj-vtest-result.json
          cat caj-vtest-result.json
      - name: Verify redirect and canonical prices
        run: |
          set +e
          sleep 25
          { dig +short vtest.coffeeandajoint.co CNAME; dig +short TXT _redirect.vtest.coffeeandajoint.co; } > caj-vtest-dns.txt 2>&1
          curl -k -sS -L -D caj-vtest-https-headers.txt -o caj-vtest-body.html -w '%{http_code}\n%{url_effective}\n' 'https://vtest.coffeeandajoint.co/' > caj-vtest-https.txt 2>caj-vtest-https-error.txt
          grep -o -E 'CRATE[^<]{0,40}\$495|\$495|\$530' caj-vtest-body.html | head -20 > caj-vtest-price-check.txt || true
          cat caj-vtest-dns.txt
          cat caj-vtest-https.txt
          cat caj-vtest-https-error.txt
          cat caj-vtest-price-check.txt
      - name: Record sanitized validation
        run: |
          git config user.name 'Misfit CAJ Cutover Bot'
          git config user.email 'pricemedia82@gmail.com'
          git add caj-vtest-result.json caj-vtest-dns.txt caj-vtest-https*.txt caj-vtest-price-check.txt
          git commit -m 'Record CoffeeAndAJoint DNS redirect validation' || exit 0
          git push
